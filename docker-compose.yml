services:
  iptv-website:
    image: php:8.2-apache
    container_name: iptv-hostinger-v85
    restart: unless-stopped
    ports:
      - "8181:80"
    environment:
      TZ: America/Toronto
    volumes:
      - iptv-v85-files:/var/www/html
    command:
      - /bin/sh
      - -ec
      - |
        apt-get update
        apt-get install -y --no-install-recommends curl unzip libcurl4-openssl-dev libxml2-dev libonig-dev
        docker-php-ext-install -j2 curl dom mbstring
        a2enmod rewrite headers
        curl -fsSL --retry 3 https://github.com/ericlvboy-dotcom/IPTV-Hostinger-v85-Docker/archive/refs/heads/main.zip -o /tmp/iptv-source.zip
        mkdir -p /tmp/iptv-release
        unzip -q /tmp/iptv-source.zip -d /tmp/iptv-release
        SRC=/tmp/iptv-release/IPTV-Hostinger-v85-Docker-main/website/source
        test -f "$$SRC/index.php" || { echo "Corrected source not yet published in GitHub; stopping without changing website"; exit 1; }
        mkdir -p /var/www/html/storage
        cp -a "$$SRC/." /var/www/html/
        chown -R www-data:www-data /var/www/html/storage
        chmod 700 /var/www/html/storage
        rm -rf /tmp/iptv-source.zip /tmp/iptv-release
        exec apache2-foreground
volumes:
  iptv-v85-files:
