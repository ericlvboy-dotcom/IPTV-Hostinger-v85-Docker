services:
  iptv-website:
    image: ghcr.io/ericlvboy-dotcom/iptv-v85-website:latest
    container_name: iptv-hostinger-v85
    restart: unless-stopped
    ports:
      - "8181:80"
    environment:
      TZ: America/Toronto
    volumes:
      - iptv-v85-files:/var/www/html

  epg-multiclient:
    image: ghcr.io/ericlvboy-dotcom/iptv-v85-epg:latest
    container_name: iptv-v85-epg
    restart: unless-stopped
    environment:
      IPTV_STORAGE: /site/storage
      EPG_INTERVAL_SECONDS: "300"
    volumes:
      - iptv-v85-files:/site

volumes:
  iptv-v85-files:
